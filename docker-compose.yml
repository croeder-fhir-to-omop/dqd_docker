services:
  enchilada:
    image: croeder/enchilada:latest
    ports:
      - "8081:8081"
    volumes:
      - enchilada-db:/db
      - ${CONCEPT_CSV:-./CONCEPT.csv}:/data/CONCEPT.csv:ro
      - ${CONCEPT_RELATIONSHIP_CSV:-./CONCEPT_RELATIONSHIP.csv}:/data/CONCEPT_RELATIONSHIP.csv:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request, ssl; ctx=ssl.create_default_context(); ctx.check_hostname=False; ctx.verify_mode=ssl.CERT_NONE; urllib.request.urlopen('https://localhost:8081/r4/metadata', context=ctx)"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 12

  matchbox:
    profiles: [r4]
    image: croeder/matchbox:r4
    ports:
      - "8080:8080"
    volumes:
      - matchbox-db:/database
    restart: unless-stopped
    depends_on:
      enchilada:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/matchboxv3/actuator/health"]
      interval: 10s
      timeout: 3s
      start_period: 300s
      retries: 6

  matchbox-r5:
    profiles: [r5]
    image: croeder/matchbox:r5
    ports:
      - "8082:8080"
    volumes:
      - matchbox-r5-db:/database
    restart: unless-stopped
    depends_on:
      enchilada:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/matchboxv3/actuator/health"]
      interval: 10s
      timeout: 3s
      start_period: 300s
      retries: 6

  dqd:
    profiles: [r4]
    image: croeder/dqd:latest
    ports:
      - "3838:3838"
      - "8088:8088"
    volumes:
      - omop-db:/omop
    environment:
      - MATCHBOX_URL=http://matchbox:8080
      - OMOP_DB_PATH=/omop/omop.ddb
    depends_on:
      matchbox:
        condition: service_healthy

  dqd-r5:
    profiles: [r5]
    image: croeder/dqd:latest
    ports:
      - "3839:3838"
      - "8089:8088"
    volumes:
      - omop-r5-db:/omop
    environment:
      - MATCHBOX_URL=http://matchbox-r5:8080
      - MATCHBOX_R5_URL=http://matchbox-r5:8080
      - OMOP_DB_PATH=/omop/omop.ddb
    depends_on:
      matchbox-r5:
        condition: service_healthy

volumes:
  matchbox-db:
  matchbox-r5-db:
  omop-db:
  omop-r5-db:
  enchilada-db:
