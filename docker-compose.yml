services:
  enchilada:
    image: croeder/enchilada:latest
    ports:
      - "8081:8081"
    volumes:
      - enchilada-db:/db
      - ${CONCEPT_CSV:-./CONCEPT.csv}:/data/CONCEPT.csv:ro
      - ${CONCEPT_RELATIONSHIP_CSV:-./CONCEPT_RELATIONSHIP.csv}:/data/CONCEPT_RELATIONSHIP.csv:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request, ssl; ctx=ssl.create_default_context(); ctx.check_hostname=False; ctx.verify_mode=ssl.CERT_NONE; urllib.request.urlopen('https://localhost:8081/r4/metadata', context=ctx)"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 12

  matchbox:
    profiles: [r4]
    image: croeder/matchbox:r4
    ports:
      - "8080:8080"
    volumes:
      - matchbox-db:/database
      - ../matchbox_docker/config/application-r4.yaml:/config/application.yaml:ro
    restart: unless-stopped
    depends_on:
      enchilada:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/matchboxv3/actuator/health"]
      interval: 10s
      timeout: 3s
      start_period: 600s
      retries: 30

  matchbox-r5:
    profiles: [r5]
    image: croeder/matchbox:r5
    ports:
      - "8082:8080"
    volumes:
      - matchbox-r5-db:/database
      - ../matchbox_docker/config/application-r5.yaml:/config/application.yaml:ro
    restart: unless-stopped
    depends_on:
      enchilada:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/matchboxv3/actuator/health"]
      interval: 10s
      timeout: 3s
      start_period: 600s
      retries: 30

  matchbox-v100:
    profiles: [v100]
    image: croeder/matchbox:r5-1.0.0
    ports:
      - "8083:8080"
    volumes:
      - matchbox-r5-v100-db:/database
      - ../matchbox_docker/config/application-r5-1.0.0.yaml:/config/application.yaml:ro
    restart: unless-stopped
    depends_on:
      enchilada:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/matchboxv3/actuator/health"]
      interval: 10s
      timeout: 3s
      start_period: 600s
      retries: 30

  dqd:
    profiles: [r4]
    image: croeder/dqd:latest
    ports:
      - "3838:3838"
      - "8088:8088"
    volumes:
      - omop-db:/omop
    environment:
      - MATCHBOX_URL=http://matchbox:8080
      - OMOP_DB_PATH=/omop/omop.ddb
      - FHIR_VERSION=r4
      - DQD_EXTERNAL_PORT=3838
    depends_on:
      matchbox:
        condition: service_healthy

  dqd-r5:
    profiles: [r5]
    image: croeder/dqd:latest
    ports:
      - "3839:3838"
      - "8089:8088"
    volumes:
      - omop-r5-db:/omop
    environment:
      - MATCHBOX_URL=http://matchbox-r5:8080
      - MATCHBOX_R5_URL=http://matchbox-r5:8080
      - OMOP_DB_PATH=/omop/omop.ddb
      - FHIR_VERSION=r5
      - DQD_EXTERNAL_PORT=3839
    depends_on:
      matchbox-r5:
        condition: service_healthy

  dqd-v100:
    profiles: [v100]
    image: croeder/dqd:latest
    ports:
      - "3840:3838"
      - "8090:8088"
    volumes:
      - omop-v100-db:/omop
    environment:
      - MATCHBOX_URL=http://matchbox-v100:8080
      - MATCHBOX_R5_URL=http://matchbox-v100:8080
      - OMOP_DB_PATH=/omop/omop.ddb
      - FHIR_VERSION=r5
      - DQD_EXTERNAL_PORT=3840
    depends_on:
      matchbox-v100:
        condition: service_healthy

volumes:
  matchbox-db:
  matchbox-r5-db:
  matchbox-r5-v100-db:
  omop-db:
  omop-r5-db:
  omop-v100-db:
  enchilada-db:
