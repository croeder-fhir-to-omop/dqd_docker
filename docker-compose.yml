services:
  matchbox:
    image: croeder/matchbox:latest
    ports:
      - "8080:8080"
    volumes:
      - matchbox-db:/database
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/matchboxv3/actuator/health"]
      interval: 10s
      timeout: 3s
      start_period: 600s
      retries: 30

  dqd:
    image: croeder/dqd:latest
    ports:
      - "3838:3838"
      - "8088:8088"
    volumes:
      - omop-db:/omop
    environment:
      - MATCHBOX_URL=http://matchbox:8080
      - MATCHBOX_R5_URL=http://matchbox:8080
      - OMOP_DB_PATH=/omop/omop.ddb
      - FHIR_VERSION=r5
      - OMOP_IG_VERSION=1.0.0
      - DQD_EXTERNAL_PORT=3838
    depends_on:
      matchbox:
        condition: service_healthy

volumes:
  matchbox-db:
  omop-db:
