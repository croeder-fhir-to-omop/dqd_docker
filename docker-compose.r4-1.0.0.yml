name: dqd_docker_r4_1_0_0

services:
  enchilada:
    image: croeder/enchilada:latest
    ports:
      - "8081:8081"
    volumes:
      - enchilada-db:/db
      - ${CONCEPT_CSV:-./CONCEPT.csv}:/data/CONCEPT.csv:ro
      - ${CONCEPT_RELATIONSHIP_CSV:-./CONCEPT_RELATIONSHIP.csv}:/data/CONCEPT_RELATIONSHIP.csv:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request, ssl; ctx=ssl.create_default_context(); ctx.check_hostname=False; ctx.verify_mode=ssl.CERT_NONE; urllib.request.urlopen('https://localhost:8081/r4/metadata', context=ctx)"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 12

  matchbox:
    image: ${MATCHBOX_IMAGE:-croeder/matchbox:r4-1.0.0}
    ports:
      - "8080:8080"
    volumes:
      - matchbox-db:/database
    environment:
      - MATCHBOX_FHIR_CONTEXT_TXSERVER=${MATCHBOX_FHIR_CONTEXT_TXSERVER:-https://enchilada:8081/r4}
    restart: unless-stopped
    depends_on:
      enchilada:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/matchboxv3/actuator/health"]
      interval: 10s
      timeout: 3s
      start_period: 600s
      retries: 30

  dqd:
    image: croeder/dqd:latest
    ports:
      - "3838:3838"
      - "8088:8088"
    volumes:
      - omop-db:/omop
    environment:
      - MATCHBOX_URL=http://matchbox:8080
      - MATCHBOX_R5_URL=http://matchbox:8080
      - OMOP_DB_PATH=/omop/omop.ddb
      - FHIR_VERSION=r4
      - OMOP_IG_VERSION=1.0.0
      - DQD_EXTERNAL_PORT=3838
      - TRANSFORM_SLEEP=${TRANSFORM_SLEEP:-0}
    depends_on:
      matchbox:
        condition: service_healthy

volumes:
  enchilada-db:
  matchbox-db:
  omop-db:
