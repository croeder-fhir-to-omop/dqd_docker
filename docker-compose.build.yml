# Build and publish the dqd image.
# Usage: docker compose -f docker-compose.build.yml build
#        docker compose -f docker-compose.build.yml push
services:
  dqd:
    build:
      context: ..
      dockerfile: dqd_docker/Dockerfile
      platforms:
        - linux/amd64
        - linux/arm64
    image: croeder/dqd:${DQD_TAG:-latest}
